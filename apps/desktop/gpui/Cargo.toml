[package]
name = "mitsuro-gpui-desktop"
version = "0.9.21"
edition = "2021"
license = "MIT"
description = "Experimental native GPUI desktop client for Mitsuro and Codex app-server"
default-run = "mitsuro-gpui-desktop"

[features]
default = ["browser-external"]
# Link wry (WebKitGTK on Linux). Probes GPUI HasWindowHandle; optional child embed
# via MITSURO_ATLAS_EMBED=1 (X11 only). Surface is mock unless embed succeeds.
browser-native = ["dep:wry"]
# System-browser bridge (xdg-open) + Chromium --app sibling. No DISPLAY needed to compile.
browser-external = []

[dependencies]
anyhow = "1.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
mitsuro-desktop-backend = { path = "../../../crates/mitsuro-desktop-backend" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
wry = { version = "0.53", optional = true }

[lints]
workspace = true
