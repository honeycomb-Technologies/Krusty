[package]
name = "mitsuro-gpui-desktop"
version = "0.10.0"
publish = false
edition = "2021"
license = "MIT"
description = "Native GPUI desktop client for Mitsuro and Codex app-server"
default-run = "mitsuro-gpui-desktop"

[features]
default = ["browser-external", "mcp-app-runtime"]
# Link wry (WebKitGTK on Linux). Probes GPUI HasWindowHandle; optional child embed
# via MITSURO_ATLAS_EMBED=1 (X11 only). The default Wayland-safe offscreen
# WebKit renderer remains available through `mcp-app-runtime`.
browser-native = ["dep:wry"]
# System-browser bridge (xdg-open) + Chromium --app sibling. No DISPLAY needed to compile.
browser-external = []
# Wayland-capable, offscreen WebKitGTK renderer for sandboxed MCP Apps.
mcp-app-runtime = ["dep:wry", "dep:gtk", "dep:webkit2gtk"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10.4"
gpui = "0.2.2"
gpui-component = "0.5.1"
mitsuro-desktop-backend = { path = "../../../crates/mitsuro-desktop-backend" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
wry = { version = "0.53", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0.1", optional = true, features = ["v2_40"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.14"
