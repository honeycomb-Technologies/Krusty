[package]
name = "mitsuro-desktop"
version = "0.9.20"
publish = false
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
tokio = { version = "1.40", features = ["full"] }
mitsuro-server = { path = "../../../../crates/mitsuro-server" }
mitsuro-core = { path = "../../../../crates/mitsuro-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
