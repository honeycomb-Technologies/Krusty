[package]
name = "krusty-desktop"
version = "0.8.0"
edition = "2021"
description = "Native GPUI desktop workspace for Krusty"
default-run = "krusty-desktop"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
