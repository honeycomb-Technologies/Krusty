[package]
name = "krusty-client"
version = "0.7.2"
edition = "2021"
description = "Async Rust client for the Krusty server API"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt"] }

[lints]
workspace = true
