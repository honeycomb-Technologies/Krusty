[package]
name = "krusty-mako-protocol"
version = "0.1.0"
edition = "2021"
description = "Private Unix IPC protocol shared by the Krusty server and Mako daemon"

[dependencies]
hmac = "0.12"
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.40", features = ["fs", "io-util", "net", "time"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
