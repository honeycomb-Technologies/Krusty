[package]
name = "krusty-server"
version = "0.9.11"
edition = "2021"
description = "Self-hosted Krusty API server library"

[dependencies]
krusty-core = { path = "../krusty-core" }
krusty-mako-protocol = { path = "../krusty-mako-protocol" }

tokio = { version = "1.40", features = ["full"] }

axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

anyhow = "1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio-stream = "0.1"
futures = "0.3"
fs2 = "0.4"

dirs = "6.0"
regex = "1.10"
uuid = { version = "1.11", features = ["v4"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
portable-pty = "0.8"

# Web Push notifications (pure Rust, no OpenSSL — matches rustls stack)
web-push-native = "0.4"
base64ct = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }

# APNs (Apple Push Notification service) — JWT auth via ES256
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
