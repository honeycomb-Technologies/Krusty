[package]
name = "mitsuro-hive"
version = "0.1.0"
edition = "2021"
description = "Independently supervised backend service for Mitsuro Hive"
default-run = "mitsuro-hive"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
mitsuro-core = { path = "../mitsuro-core" }
mitsuro-hive-protocol = { path = "../mitsuro-hive-protocol" }
mitsuro-server = { path = "../mitsuro-server" }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mitsuro-hive"
path = "src/main.rs"

[[bin]]
name = "krusty-mako"
path = "src/bin/krusty-mako.rs"

[lints]
workspace = true
