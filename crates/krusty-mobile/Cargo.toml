[package]
name = "krusty-mobile"
version = "0.7.0"
edition = "2021"
description = "Native GPUI mobile preview client for Krusty"
default-run = "krusty-mobile"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
krusty-client = { path = "../krusty-client" }
krusty-client-state = { path = "../krusty-client-state" }
krusty-mobile-ui = { path = "../krusty-mobile-ui" }
tokio = { version = "1.40", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
