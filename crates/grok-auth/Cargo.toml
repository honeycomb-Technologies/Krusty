[package]
name = "grok-auth"
version = "0.1.0"
publish = false
edition = "2021"
description = "Modular, reusable xAI / Grok authentication client for Rust harnesses including Mitsuro. Interoperable with the official `grok` CLI via ~/.grok/auth.json."
license = "MIT OR Apache-2.0"
keywords = ["xai", "grok", "auth", "oidc", "oauth2"]
categories = ["authentication"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.5"
webbrowser = "0.8"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4" # file locking for concurrent harnesses + grok CLI
axum = "0.7" # lightweight callback server for OIDC PKCE
tower = "0.4"
hyper = "1"
tracing = "0.1" # optional but recommended
toml = "0.8" # for merging user harness config.toml snippets
dirs = "5" # for default ~/.grok path
anyhow = "1" # ergonomic error conversion in examples

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tracing-subscriber = "0.3"

[features]
default = ["oidc-login"]
oidc-login = []          # enables browser/device OIDC flows (always on for now)

[[example]]
name = "mitsuro_auth"
path = "examples/mitsuro_auth.rs"
