name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  canonical-identity:
    name: Canonical Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check canonical names and exact compatibility exceptions
        run: bash scripts/check-canonical-names.sh
      - name: Check product marketing versions stay aligned
        run: sh scripts/check-product-version.sh
      - name: Check workspace Cargo.lock versions stay aligned
        run: sh scripts/refresh-workspace-lock-versions.sh --check
      - name: Exercise installer migration and rollback fixtures
        run: sh install.sh --self-test

  client-quality:
    name: Client Quality Gates
    needs: canonical-identity
    uses: ./.github/workflows/client-quality.yml

  rust-check:
    name: Rust Check
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo check --workspace

  rust-test:
    name: Rust Test
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ripgrep \
            bubblewrap
      - name: Allow bubblewrap user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --workspace

  rust-clippy:
    name: Rust Clippy
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  rust-format:
    name: Rust Format
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  desktop-linux-bundle:
    name: Desktop Linux Bundle
    needs: canonical-identity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/shell
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run build
