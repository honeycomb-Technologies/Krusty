name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Build mobile web frontend
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../krusty-${{ matrix.target }}.tar.gz krusty

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../krusty-${{ matrix.target }}.zip krusty.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krusty-${{ matrix.target }}
          path: krusty-${{ matrix.target }}.*

  desktop-linux:
    name: Build Desktop Linux Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install desktop bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libudev-dev             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Build Linux desktop bundles
        working-directory: apps/desktop/shell
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload desktop Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krusty-desktop-linux
          path: |
            apps/desktop/shell/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/shell/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    name: Create Release
    needs: [build, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
