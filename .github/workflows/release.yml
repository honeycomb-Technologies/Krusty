name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  client-quality:
    name: Client Quality Gates
    uses: ./.github/workflows/client-quality.yml

  build:
    name: Build ${{ matrix.target }}
    needs: client-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Bun
        run: npm install -g bun

      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Build mobile web frontend
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} -p krusty -p krusty-mako

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} -p krusty

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          package_dir="krusty-${{ matrix.target }}"
          mkdir -p "$package_dir/systemd"
          cp "target/${{ matrix.target }}/release/krusty" "$package_dir/"
          cp "target/${{ matrix.target }}/release/krusty-mako" "$package_dir/"
          cp deploy/systemd/krusty-mako.service "$package_dir/systemd/"
          cp deploy/systemd/krusty-mako.socket "$package_dir/systemd/"
          cp deploy/systemd/krusty-serve.service "$package_dir/systemd/"
          tar czf "krusty-${{ matrix.target }}.tar.gz" -C "$package_dir" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum krusty-${{ matrix.target }}.tar.gz > krusty-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 krusty-${{ matrix.target }}.tar.gz > krusty-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../krusty-${{ matrix.target }}.zip krusty.exe
          cd ../../..
          sha256sum krusty-${{ matrix.target }}.zip > krusty-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krusty-${{ matrix.target }}
          path: krusty-${{ matrix.target }}.*

  desktop-linux:
    name: Build Desktop Linux Bundles
    needs: client-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install desktop bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libudev-dev             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf

      - name: Install Bun
        run: npm install -g bun

      - name: Install Rust
        run: rustup show

      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Build Linux desktop bundles
        working-directory: apps/desktop/shell
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload desktop Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krusty-desktop-linux
          path: |
            apps/desktop/shell/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/shell/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    name: Create Release
    needs: [build, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require protected release tag
        if: github.ref_protected != true
        run: |
          echo "Release tags must be protected before publishing artifacts." >&2
          exit 1

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Render and validate Homebrew formula
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash .github/homebrew/render-formula.sh \
            "$TAG_NAME" \
            artifacts \
            artifacts/homebrew/krusty.rb

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t release_assets < <(find artifacts -type f -print | sort)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          declare -A expected_by_name=()
          desktop_deb_count=0
          desktop_rpm_count=0
          for asset in "${release_assets[@]}"; do
            asset_name=${asset##*/}
            if [[ -n "${expected_by_name[$asset_name]+present}" ]]; then
              echo "Release assets contain duplicate basename: $asset_name" >&2
              exit 1
            fi
            expected_by_name[$asset_name]=$asset
            case "$asset_name" in
              krusty-aarch64-apple-darwin.tar.gz | \
              krusty-aarch64-apple-darwin.tar.gz.sha256 | \
              krusty-x86_64-apple-darwin.tar.gz | \
              krusty-x86_64-apple-darwin.tar.gz.sha256 | \
              krusty-aarch64-unknown-linux-gnu.tar.gz | \
              krusty-aarch64-unknown-linux-gnu.tar.gz.sha256 | \
              krusty-x86_64-unknown-linux-gnu.tar.gz | \
              krusty-x86_64-unknown-linux-gnu.tar.gz.sha256 | \
              krusty-x86_64-pc-windows-msvc.zip | \
              krusty-x86_64-pc-windows-msvc.zip.sha256 | \
              krusty.rb)
                ;;
              *.deb)
                desktop_deb_count=$((desktop_deb_count + 1))
                ;;
              *.rpm)
                desktop_rpm_count=$((desktop_rpm_count + 1))
                ;;
              *)
                echo "Unexpected release asset: $asset_name" >&2
                exit 1
                ;;
            esac
          done

          required_assets=(
            krusty-aarch64-apple-darwin.tar.gz
            krusty-aarch64-apple-darwin.tar.gz.sha256
            krusty-x86_64-apple-darwin.tar.gz
            krusty-x86_64-apple-darwin.tar.gz.sha256
            krusty-aarch64-unknown-linux-gnu.tar.gz
            krusty-aarch64-unknown-linux-gnu.tar.gz.sha256
            krusty-x86_64-unknown-linux-gnu.tar.gz
            krusty-x86_64-unknown-linux-gnu.tar.gz.sha256
            krusty-x86_64-pc-windows-msvc.zip
            krusty-x86_64-pc-windows-msvc.zip.sha256
            krusty.rb
          )
          for asset_name in "${required_assets[@]}"; do
            if [[ -z "${expected_by_name[$asset_name]+present}" ]]; then
              echo "Required release asset is missing: $asset_name" >&2
              exit 1
            fi
          done
          if [[ "$desktop_deb_count" -ne 1 || "$desktop_rpm_count" -ne 1 ]]; then
            echo "Expected exactly one desktop .deb and one .rpm asset." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir=$(mktemp -d)
            trap 'rm -rf -- "$existing_dir"' EXIT
            gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir"
            mapfile -t existing_assets < <(find "$existing_dir" -type f -print | sort)
            if [[ "${#existing_assets[@]}" -ne "${#release_assets[@]}" ]]; then
              echo "Existing release asset set differs; protected-tag assets are immutable." >&2
              exit 1
            fi
            declare -A existing_by_name=()
            for asset in "${existing_assets[@]}"; do
              asset_name=${asset##*/}
              if [[ -n "${existing_by_name[$asset_name]+present}" ]]; then
                echo "Existing release contains duplicate basename: $asset_name" >&2
                exit 1
              fi
              existing_by_name[$asset_name]=$asset
            done
            for asset_name in "${!expected_by_name[@]}"; do
              if [[ -z "${existing_by_name[$asset_name]+present}" ]]; then
                echo "Existing release is missing immutable asset: $asset_name" >&2
                exit 1
              fi
              if ! cmp -s "${expected_by_name[$asset_name]}" "${existing_by_name[$asset_name]}"; then
                echo "Existing release asset differs and will not be replaced: $asset_name" >&2
                exit 1
              fi
            done
            echo "Existing release assets are byte-identical; no upload required."
          else
            gh release create "$TAG_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
