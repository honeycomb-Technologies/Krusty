[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/gpui"]

# Default to running krusty-cli
default-members = ["crates/krusty-cli"]

[patch.crates-io]
# Keep gpui-component on the published GPUI 0.2.2 API while allowing us to add
# Krusty-owned mobile platform backends that crates.io GPUI does not expose.
gpui = { path = "vendor/gpui" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Lint configuration - prevent dead code accumulation
[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"

[workspace.lints.clippy]
# Catch common issues
redundant_clone = "warn"
unnecessary_wraps = "warn"
# Allow these in development (too noisy otherwise)
too_many_arguments = "allow"
type_complexity = "allow"
